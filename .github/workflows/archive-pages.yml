name: Build archive and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: archive-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Regenerate indexes after published model files and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python scripts/brief_archive/build.py
            git add daily-results/index.html daily-results/manifest.json 'daily-results/*/index.html'
            if ! git diff --cached --quiet; then
              git commit -m 'docs: refresh daily archive indexes'
            fi
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Assemble static site from tracked public files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
